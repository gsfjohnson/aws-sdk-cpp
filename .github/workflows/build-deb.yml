name: Build Debian Packages

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  INSTALL_PREFIX: /usr

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ make \
            libcurl4-openssl-dev libssl-dev \
            zlib1g-dev \
            dpkg-dev

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version_override }}" ]]; then
            VERSION="${{ github.event.inputs.version_override }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(git describe --tags --always | sed 's/^v//')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Configure CMake (shared)
        run: |
          cmake -B build-shared \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
            -DBUILD_ONLY="s3;sqs;sns" \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_TESTING=OFF \
            -DAUTORUN_UNIT_TESTS=OFF \
            -DENABLE_UNITY_BUILD=ON \
            -DCPP_STANDARD=17

      - name: Build (shared)
        run: cmake --build build-shared --config ${{ env.BUILD_TYPE }} -j $(nproc)

      - name: Install shared to staging
        run: |
          DESTDIR="${{ github.workspace }}/pkg-root" \
            cmake --install build-shared --config ${{ env.BUILD_TYPE }}

      - name: Configure CMake (static)
        run: |
          cmake -B build-static \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
            -DBUILD_ONLY="s3;sqs;sns" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_TESTING=OFF \
            -DAUTORUN_UNIT_TESTS=OFF \
            -DENABLE_UNITY_BUILD=ON \
            -DCPP_STANDARD=17

      - name: Build (static)
        run: cmake --build build-static --config ${{ env.BUILD_TYPE }} -j $(nproc)

      - name: Install static to staging
        run: |
          DESTDIR="${{ github.workspace }}/pkg-root" \
            cmake --install build-static --config ${{ env.BUILD_TYPE }}

      - name: Package aws-sdk-cpp
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="$(dpkg --print-architecture)"
          PKG_NAME="aws-sdk-cpp"
          PKG_FILE="${PKG_NAME}_${VERSION}_${ARCH}.deb"
          PKG_DIR="${{ github.workspace }}/pkg-root"

          mkdir -p "${PKG_DIR}/DEBIAN"

          INSTALLED_SIZE=$(du -sk "${PKG_DIR}" | cut -f1)

          cat > "${PKG_DIR}/DEBIAN/control" <<-EOF
          Package: ${PKG_NAME}
          Version: ${VERSION}
          Section: libs
          Priority: optional
          Architecture: ${ARCH}
          Depends: libcurl4 (>= 7.58), libssl3 | libssl1.1, zlib1g
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: ${{ github.repository_owner }} <noreply@github.com>
          Homepage: https://github.com/${{ github.repository }}
          Description: AWS SDK for C++ - shared and static libraries
           Complete AWS SDK for C++ including all service clients,
           core runtime, AWS CRT dependencies, development headers,
           and both shared and static libraries.
          EOF

          dpkg-deb --build "${PKG_DIR}" "${{ github.workspace }}/${PKG_FILE}"

          echo "pkg_file=${PKG_FILE}" >> "$GITHUB_OUTPUT"
          echo "pkg_path=${{ github.workspace }}/${PKG_FILE}" >> "$GITHUB_OUTPUT"

      - name: Verify package
        run: |
          dpkg-deb --info "${{ steps.package.outputs.pkg_path }}"
          echo "--- contents (first 100 entries) ---"
          dpkg-deb --contents "${{ steps.package.outputs.pkg_path }}" | head -100

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.pkg_file }}
          path: ${{ steps.package.outputs.pkg_path }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.pkg_path }}
