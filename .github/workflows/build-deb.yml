name: Build Debian Packages

on: [push]

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  INSTALL_PREFIX: /usr

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ make \
            libcurl4-openssl-dev libssl-dev \
            zlib1g-dev \
            dpkg-dev

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version_override }}" ]]; then
            VERSION="${{ github.event.inputs.version_override }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(git describe --tags --always | sed 's/^v//')"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
            -DBUILD_ONLY="s3" \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_TESTING=OFF \
            -DAUTORUN_UNIT_TESTS=OFF \
            -DENABLE_UNITY_BUILD=ON \
            -DCPP_STANDARD=17

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j $(nproc)

      - name: Install to staging directory
        run: |
          DESTDIR="${{ github.workspace }}/pkg-root" \
            cmake --install build --config ${{ env.BUILD_TYPE }}

      - name: Package aws-sdk-cpp-core
        id: core_package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="$(dpkg --print-architecture)"
          PKG_NAME="aws-sdk-cpp-core"
          PKG_FILE="${PKG_NAME}_${VERSION}_${ARCH}.deb"
          PKG_DIR="${{ github.workspace }}/deb-core"
          STAGING="${{ github.workspace }}/pkg-root"

          mkdir -p "${PKG_DIR}/DEBIAN"

          # Copy everything except s3-specific files into the core package
          cd "${STAGING}"
          find . -type f -o -type l | grep -v -E '/(libaws-cpp-sdk-s3[^-]|aws-cpp-sdk-s3/)' | while read -r f; do
            mkdir -p "${PKG_DIR}/$(dirname "$f")"
            cp -a "$f" "${PKG_DIR}/$f"
          done

          INSTALLED_SIZE=$(du -sk "${PKG_DIR}" | cut -f1)

          cat > "${PKG_DIR}/DEBIAN/control" <<-EOF
          Package: ${PKG_NAME}
          Version: ${VERSION}
          Section: libs
          Priority: optional
          Architecture: ${ARCH}
          Depends: libcurl4 (>= 7.58), libssl3 | libssl1.1, zlib1g
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: ${{ github.repository_owner }} <noreply@github.com>
          Homepage: https://github.com/${{ github.repository }}
          Description: AWS SDK for C++ - Core libraries and headers
           Provides the AWS SDK for C++ core runtime library, AWS CRT
           dependencies, and development headers. Required by all AWS
           SDK for C++ service packages.
          EOF
          sed -i 's/^[[:space:]]*//' "${PKG_DIR}/DEBIAN/control"

          dpkg-deb --build "${PKG_DIR}" "${{ github.workspace }}/${PKG_FILE}"

          echo "pkg_file=${PKG_FILE}" >> "$GITHUB_OUTPUT"
          echo "pkg_path=${{ github.workspace }}/${PKG_FILE}" >> "$GITHUB_OUTPUT"

      - name: Package aws-sdk-cpp-s3
        id: s3_package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="$(dpkg --print-architecture)"
          PKG_NAME="aws-sdk-cpp-s3"
          PKG_FILE="${PKG_NAME}_${VERSION}_${ARCH}.deb"
          PKG_DIR="${{ github.workspace }}/deb-s3"
          STAGING="${{ github.workspace }}/pkg-root"

          mkdir -p "${PKG_DIR}/DEBIAN"

          # Copy only s3-specific libraries, headers, and cmake config
          cd "${STAGING}"
          find . -type f -o -type l | grep -E '/(libaws-cpp-sdk-s3[^-]|aws-cpp-sdk-s3/)' | while read -r f; do
            mkdir -p "${PKG_DIR}/$(dirname "$f")"
            cp -a "$f" "${PKG_DIR}/$f"
          done

          INSTALLED_SIZE=$(du -sk "${PKG_DIR}" | cut -f1)

          cat > "${PKG_DIR}/DEBIAN/control" <<-EOF
          Package: ${PKG_NAME}
          Version: ${VERSION}
          Section: libs
          Priority: optional
          Architecture: ${ARCH}
          Depends: aws-sdk-cpp-core (= ${VERSION})
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: ${{ github.repository_owner }} <noreply@github.com>
          Homepage: https://github.com/${{ github.repository }}
          Description: AWS SDK for C++ - Amazon S3 client
           Provides the AWS SDK for C++ Amazon S3 service client as a
           shared library with development headers.
          EOF
          sed -i 's/^[[:space:]]*//' "${PKG_DIR}/DEBIAN/control"

          dpkg-deb --build "${PKG_DIR}" "${{ github.workspace }}/${PKG_FILE}"

          echo "pkg_file=${PKG_FILE}" >> "$GITHUB_OUTPUT"
          echo "pkg_path=${{ github.workspace }}/${PKG_FILE}" >> "$GITHUB_OUTPUT"

      - name: Verify packages
        run: |
          echo "=== aws-sdk-cpp-core ==="
          dpkg-deb --info "${{ steps.core_package.outputs.pkg_path }}"
          echo "--- contents (first 50 entries) ---"
          dpkg-deb --contents "${{ steps.core_package.outputs.pkg_path }}" | head -50
          echo ""
          echo "=== aws-sdk-cpp-s3 ==="
          dpkg-deb --info "${{ steps.s3_package.outputs.pkg_path }}"
          echo "--- contents ---"
          dpkg-deb --contents "${{ steps.s3_package.outputs.pkg_path }}"

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.core_package.outputs.pkg_file }}
          path: ${{ steps.core_package.outputs.pkg_path }}

      - name: Upload s3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.s3_package.outputs.pkg_file }}
          path: ${{ steps.s3_package.outputs.pkg_path }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.core_package.outputs.pkg_path }}
            ${{ steps.s3_package.outputs.pkg_path }}
